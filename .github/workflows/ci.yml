name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Resolve dependencies on this PHP version
        run: composer update --no-interaction --prefer-dist

      - name: Lint
        run: composer lint

      - name: PHPCS
        run: composer cs

      - name: PHPStan
        if: matrix.php == '8.2'
        run: composer stan

      - name: PHPUnit
        run: composer test

      - name: Benchmark smoke
        if: matrix.php == '8.2'
        run: composer bench

  prefer-lowest:
    name: PHP 8.2 prefer-lowest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Resolve lowest supported dependencies
        run: composer update --no-interaction --prefer-dist --prefer-lowest

      - name: PHPUnit
        run: composer test
