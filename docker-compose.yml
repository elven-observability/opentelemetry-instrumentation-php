services:
  php82:
    image: php:8.2-cli
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "php vendor/bin/phpunit && php vendor/bin/phpstan analyse --memory-limit=1G"

  php83:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "php vendor/bin/phpunit"

  php84:
    image: php:8.4-cli
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "php vendor/bin/phpunit"

  php85:
    image: php:8.5-cli
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "php vendor/bin/phpunit"

  fake-collector:
    image: php:8.2-cli
    working_dir: /app
    volumes:
      - .:/app
    environment:
      ELVEN_FAKE_COLLECTOR_STORE: /tmp/elven-fake-collector.jsonl
    ports:
      - "43189:43189"
    command: php -S 0.0.0.0:43189 examples/fake-collector/server.php
